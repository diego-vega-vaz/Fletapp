name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Un secreto que no existe llega como cadena vacia y el build compila
      # una app rota en silencio. Mejor tronar aqui con un mensaje claro.
      - name: Verificar que existan los secretos
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Falta el secreto VITE_SUPABASE_URL en Settings > Secrets and variables > Actions"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Falta el secreto VITE_SUPABASE_ANON_KEY en Settings > Secrets and variables > Actions"; exit 1; }
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc -b

      - name: Compilar
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Corre sobre el bundle compilado, no sobre el codigo fuente, para que
      # cubra tambien las pantallas que estan detras del login.
      - name: Guardia de honestidad
        run: node scripts/verificar-verdad.mjs

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
